id = "pi.herdr-sidebar"
name = "Pi Herdr Sidebar"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Herdr telemetry and skills sidebar for Pi coding agent with Ratatui TUI"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "sidebar"
title = "Pi Herdr Sidebar"
placement = "split"
command = ["target/release/pi_sidebar", "view"]
platforms = ["linux", "macos"]

[[panes]]
id = "sidebar-win"
title = "Pi Herdr Sidebar"
placement = "split"
command = ["target/release/pi_sidebar.exe", "view"]
platforms = ["windows"]

[[panes]]
id = "sidebar-popup"
title = "Pi Herdr Sidebar Popup"
placement = "popup"
width = "80%"
height = 24
command = ["target/release/pi_sidebar", "popup"]
platforms = ["linux", "macos"]

[[panes]]
id = "sidebar-popup-win"
title = "Pi Herdr Sidebar Popup"
placement = "popup"
width = "80%"
height = 24
command = ["target/release/pi_sidebar.exe", "popup"]
platforms = ["windows"]

# Large modal devoted to the SPAI Notes editor — same mechanic as the Kanban
# board (`placement = "popup"`), opened straight on the Notes face.
[[panes]]
id = "notes-popup"
title = "Pi Herdr Notes Editor"
placement = "popup"
width = "92%"
height = "88%"
command = ["target/release/pi_sidebar", "popup", "--tab", "notes"]
platforms = ["linux", "macos"]

[[panes]]
id = "notes-popup-win"
title = "Pi Herdr Notes Editor"
placement = "popup"
width = "92%"
height = "88%"
command = ["target/release/pi_sidebar.exe", "popup", "--tab", "notes"]
platforms = ["windows"]

# Plugin/skill usage overview as a standalone window (no sidebar chrome),
# opened by its own keybinding.
[[panes]]
id = "usage"
title = "Pi Herdr Plugin Usage"
placement = "popup"
width = "92%"
height = "88%"
command = ["target/release/pi_sidebar", "usage"]
platforms = ["linux", "macos"]

[[panes]]
id = "usage-win"
title = "Pi Herdr Plugin Usage"
placement = "popup"
width = "92%"
height = "88%"
command = ["target/release/pi_sidebar.exe", "usage"]
platforms = ["windows"]

[[actions]]
id = "toggle"
title = "Toggle Pi Herdr Sidebar"
contexts = ["workspace"]
command = ["target/release/pi_sidebar", "toggle"]
platforms = ["linux", "macos"]

[[actions]]
id = "toggle-win"
title = "Toggle Pi Herdr Sidebar"
contexts = ["workspace"]
command = ["target/release/pi_sidebar.exe", "toggle"]
platforms = ["windows"]

[[actions]]
id = "popup"
title = "Open Pi Herdr Sidebar Popup"
contexts = ["workspace"]
command = ["target/release/pi_sidebar", "popup-action"]
platforms = ["linux", "macos"]

[[actions]]
id = "popup-win"
title = "Open Pi Herdr Sidebar Popup"
contexts = ["workspace"]
command = ["target/release/pi_sidebar.exe", "popup-action"]
platforms = ["windows"]

[[actions]]
id = "edit-notes"
title = "Open Pi Herdr Notes Editor (modal)"
contexts = ["workspace"]
command = ["target/release/pi_sidebar", "notes-popup-action"]
platforms = ["linux", "macos"]

[[actions]]
id = "edit-notes-win"
title = "Open Pi Herdr Notes Editor (modal)"
contexts = ["workspace"]
command = ["target/release/pi_sidebar.exe", "notes-popup-action"]
platforms = ["windows"]

[[actions]]
id = "usage"
title = "Open Pi Herdr Plugin Usage (window)"
contexts = ["workspace"]
command = ["target/release/pi_sidebar", "usage-popup-action"]
platforms = ["linux", "macos"]

[[actions]]
id = "usage-win"
title = "Open Pi Herdr Plugin Usage (window)"
contexts = ["workspace"]
command = ["target/release/pi_sidebar.exe", "usage-popup-action"]
platforms = ["windows"]

[[actions]]
id = "switch-tab"
title = "Switch Sidebar Tab"
contexts = ["workspace"]
command = ["target/release/pi_sidebar", "switch-tab"]
platforms = ["linux", "macos"]

[[actions]]
id = "switch-tab-win"
title = "Switch Sidebar Tab"
contexts = ["workspace"]
command = ["target/release/pi_sidebar.exe", "switch-tab"]
platforms = ["windows"]

[[events]]
on = "workspace.created"
platforms = ["linux", "macos"]
command = ["target/release/pi_sidebar", "ensure"]

[[events]]
on = "workspace.created"
platforms = ["windows"]
command = ["target/release/pi_sidebar.exe", "ensure"]

[[events]]
on = "tab.focused"
platforms = ["linux", "macos"]
command = ["target/release/pi_sidebar", "ensure"]

[[events]]
on = "tab.focused"
platforms = ["windows"]
command = ["target/release/pi_sidebar.exe", "ensure"]

[[events]]
on = "workspace.focused"
platforms = ["linux", "macos"]
command = ["target/release/pi_sidebar", "ensure"]

[[events]]
on = "workspace.focused"
platforms = ["windows"]
command = ["target/release/pi_sidebar.exe", "ensure"]

[[events]]
on = "tab.created"
platforms = ["linux", "macos"]
command = ["target/release/pi_sidebar", "ensure"]

[[events]]
on = "tab.created"
platforms = ["windows"]
command = ["target/release/pi_sidebar.exe", "ensure"]

[[events]]
on = "pane.focused"
platforms = ["linux", "macos"]
command = ["target/release/pi_sidebar", "ensure"]

[[events]]
on = "pane.focused"
platforms = ["windows"]
command = ["target/release/pi_sidebar.exe", "ensure"]
