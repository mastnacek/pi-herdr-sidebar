[package]
name = "pi_sidebar"
version = "0.1.0"
edition = "2021"

[dependencies]
# `unstable-rendered-line-info` exposes `Paragraph::line_count(width)`, which
# the notes editor uses to keep the cursor row inside the visible body viewport.
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.28" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ansi-to-tui = "7.0"

# Unix-only: `libc::kill(pid, 0)` liveness probe in shared/snapshot.rs (PidLock).
# Never needed on Windows builds, where the cfg(unix) block is compiled out.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Disk hygiene: this crate is built constantly (dev loop + pane rebuilds).
# Debug info and incremental caches were ballooning target/ to 70+ GB and
# every killed build leaked a multi-GB temp link archive. Slim profiles:
# release stays small and self-contained, dev/test builds stay lean.
[profile.release]
strip = true

[profile.dev]
debug = false
incremental = false

[profile.test]
debug = false
incremental = false
